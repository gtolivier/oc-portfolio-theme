name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.168.0'
    - name: Install dependencies
      run: npm ci
    # Moteurs des projets de playwright.config.ts : garder les deux listes
    # identiques. Les tests tournent en headless : le shell suffit.
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps --only-shell chromium webkit
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
