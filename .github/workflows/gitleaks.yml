name: Gitleaks
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    name: gitleaks
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: '8.30.1'
      # Empreinte de gitleaks_8.30.1_linux_x64.tar.gz, d'après le fichier
      # checksums.txt de la release.
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install gitleaks
      run: |
        archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        curl -sSfL -o "$RUNNER_TEMP/$archive" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
        echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
    # Tout l'historique à chaque fois : toutes les branches et tous les tags,
    # commits de fusion compris (-m), quel que soit le nombre de commits.
    - name: Scan
      run: >-
        "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner
        --log-opts="--full-history --all -m" .
