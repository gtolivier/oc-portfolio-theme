# Règles par défaut de gitleaks, plus les chemins absolus d'un dossier
# personnel macOS ou Windows (règle « Avant publication » d'AGENTS.md).
# Les chemins /home/… échappent à la règle : la liste d'exceptions par
# défaut de gitleaks les ignore.
[extend]
useDefault = true

[[rules]]
id = "chemin-local"
description = "Chemin absolu d'un dossier personnel"
regex = '''(?:/Users/|[A-Za-z]:\\Users\\)[A-Za-z0-9._-]+'''
