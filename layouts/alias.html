<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
<head>
<meta charset="utf-8">
<title>{{ .Permalink }}</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="{{ .Permalink }}">
<noscript><meta http-equiv="refresh" content="0; url={{ .Permalink }}"></noscript>
<script>
(function () {
  var targets = { {{ range .Page.AllTranslations }}{{ .Language.Lang }}: {{ .Permalink }},{{ end }} };
  var languages = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
  var target = {{ .Permalink }};
  function primaryLanguage(tag) { return tag.split('-')[0].toLowerCase(); }
  try { var saved = localStorage.getItem({{ partial "lang-storage-key.html" . }}); if (saved && targets[primaryLanguage(saved)]) languages = [saved]; } catch (e) {}
  for (var i = 0; i < languages.length; i++) {
    var lang = primaryLanguage(languages[i]);
    if (targets[lang]) { target = targets[lang]; break; }
  }
  location.replace(target + location.search + location.hash);
})();
</script>
</head>
</html>
