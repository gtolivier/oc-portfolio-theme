{{ define "main" }}
  <h1>{{ site.Params.author }}
    {{- with .Params.hero.title }}
    <span class="hero-title">{{ . }}</span>
    {{- end }}
  </h1>
  {{- with .Params.hero.tagline }}
  <p class="hero-tagline">
    {{- range . }}{{ . }}<br>{{ end -}}
  </p>
  {{- end }}
  {{- with .Params.hero.stack }}
  <p class="hero-stack">{{ delimit . " · " }}</p>
  {{- end }}
  {{ .Content }}
{{ end }}
