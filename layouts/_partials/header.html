<a href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }}">
  {{- range site.Params.initials }}<span>| {{ . }} |||</span> {{ end -}}
</a>
<nav>
  {{- $page := . }}
  {{- range site.Menus.main }}
  <a href="{{ .URL }}"{{ if eq .URL $page.RelPermalink }} aria-current="page"{{ end }}>{{ .Name }}</a>
  {{- end }}
</nav>
