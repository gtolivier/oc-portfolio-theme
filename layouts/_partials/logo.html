{{- /* The initials and bars are decoration, hidden from screen readers:
  a caller that needs a name gives it, as the header link's aria-label does.
  The .logo class fixes their look; a caller may only resize them, through
  --logo-size. */ -}}
<span class="logo" aria-hidden="true">
  {{- range site.Params.initials }}<span><b>|</b> {{ . }} |||</span> {{ end -}}
</span>
