# The theme's demo site: the ground the Playwright tests run against.
baseURL = 'http://localhost:1313/'
title = 'Exemple'
defaultContentLanguage = 'fr'
defaultContentLanguageInSubdir = true
disableKinds = ['taxonomy', 'term']

# `hugo server` serves each language's 404 page for unknown addresses only
# through these redirects (a production host does it on its own).
[[server.redirects]]
  from = '/fr/**'
  to = '/fr/404.html'
  status = 404
[[server.redirects]]
  from = '/en/**'
  to = '/en/404.html'
  status = 404

[params]
  # Sample initials shown by the header logo.
  initials = ['E', 'X']
  # Sample author shown in the footer.
  author = 'Jean Exemple'
  # The address the contact form posts to: a path on the site's own domain,
  # written from the domain's root, as the form posts to it as given (a
  # baseURL with a subpath does not prefix it).
  # The endpoint gets the fields email, message, contact_reference (a decoy
  # that must stay empty) and lang (the language of the page the form was
  # sent from, such as fr or en), form-encoded with or without JavaScript.
  # Without JavaScript, it sends the visitor back with a 303 to that
  # language's home page, at /<lang>/#contact-sent or
  # /<lang>/#contact-error; when the request asks for JSON
  # (Accept: application/json), it answers with a 2xx status on success and
  # any other on failure. That return address supposes each language's home
  # page in its own folder at the domain's root, as here
  # (defaultContentLanguageInSubdir = true, a baseURL without a subpath), and
  # an endpoint that knows the site's languages, so that it never sends the
  # visitor to an address the lang field alone chose.
  contactAction = '/api/contact'
  # The top-level section the home page's featured projects live in, and
  # that its all-projects link opens. Left out, it is projects; set it when
  # the projects live in another section, by its folder name.
  # projectsSection = 'projects'

# The sample content may contain raw HTML (e.g. a positioned box on the
# long page), as a project card or a figure would.
[markup.goldmark.renderer]
  unsafe = true

[languages]
  [languages.fr]
    locale = 'fr-FR'
    weight = 1
    # Sample footer note, specific to each language.
    [languages.fr.params]
      footerNote = 'Horloger de démonstration'
    # Main header menu, specific to each language.
    [[languages.fr.menus.main]]
      name = 'Accueil'
      pageRef = '/'
      weight = 10
    [[languages.fr.menus.main]]
      name = 'Projets'
      pageRef = '/projects'
      weight = 20
    [[languages.fr.menus.main]]
      name = 'Contact'
      url = '/fr/#contact'
      weight = 30
  [languages.en]
    locale = 'en-US'
    weight = 2
    [languages.en.params]
      footerNote = 'Sample clockmaker'
    [[languages.en.menus.main]]
      name = 'Home'
      pageRef = '/'
      weight = 10
    [[languages.en.menus.main]]
      name = 'Projects'
      pageRef = '/projects'
      weight = 20
    [[languages.en.menus.main]]
      name = 'Contact'
      url = '/en/#contact'
      weight = 30

# The theme is imported as a module and read from this repository itself
# (path relative to exampleSite/themes), whatever the cloned folder's name.
[module]
  replacements = 'github.com/gtolivier/oc-portfolio-theme -> ../..'
  [[module.imports]]
    path = 'github.com/gtolivier/oc-portfolio-theme'
