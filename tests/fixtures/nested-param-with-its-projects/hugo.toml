# Configuration added to exampleSite/hugo.toml by the tests of a site whose
# featured projects live in a subsection of projects, horlogerie, and whose
# projectsSection site param names that subsection, 'projects/horlogerie',
# rather than a top-level section. The fixture's content/ adds that subsection
# and replaces both home pages.
[params]
  projectsSection = 'projects/horlogerie'
