# Configuration ajoutée à exampleSite/hugo.toml par les tests des anciennes
# adresses (alias), en plus des pages de test de content/ qui en déclarent :
# l'accueil anglais du site d'exemple reçoit lui aussi une ancienne adresse,
# /en/english/, sans que son contenu soit recopié ici.
[[cascade]]
  aliases = ['/english/']
  [cascade.target]
    kind = 'home'
    [cascade.target.sites.matrix]
      languages = ['en']
