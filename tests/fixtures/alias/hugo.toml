# Configuration added to exampleSite/hugo.toml by the tests of old addresses
# (aliases), on top of the test pages in content/ that declare some: the
# example site's English home page also gets an old address, /en/english/,
# without its content being copied here.
[[cascade]]
  aliases = ['/english/']
  [cascade.target]
    kind = 'home'
    [cascade.target.sites.matrix]
      languages = ['en']
