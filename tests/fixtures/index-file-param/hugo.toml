# Configuration added to exampleSite/hugo.toml by the tests of a site that
# keeps the example site's content, whose featured projects live in its projects
# section, but whose projectsSection site param is 'projects/_index.md', the
# path of that section's own page rather than the section's name, which Hugo's
# GetPage still resolves to that top-level section.
[params]
  projectsSection = 'projects/_index.md'
