# Configuration ajoutée à exampleSite/hugo.toml par le test d'un bouton du
# hero dont le pageRef ne mène à aucune page : l'accueil français du site
# d'exemple (content/_index.md) est remplacé par celui de
# tests/fixtures/page-ref-introuvable/content, dont le premier bouton
# déclare pageRef = '/page-fictive-introuvable'. Le reste du contenu du site
# d'exemple est monté tel quel. Les chemins sont relatifs à exampleSite/,
# dossier source de la construction.
[[module.mounts]]
  source = 'content'
  target = 'content'
  files = ['! /_index.md']
[[module.mounts]]
  source = '../tests/fixtures/page-ref-introuvable/content'
  target = 'content'
