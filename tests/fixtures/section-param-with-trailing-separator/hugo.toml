# Configuration added to exampleSite/hugo.toml by the tests of a site whose
# projectsSection site param names the example site's section of projects
# with a slash at its end, 'projects/', as a folder would be written. The
# fixture has no content/: the example site's home pages, which feature
# projects of projects/, are built as they are.
[params]
  projectsSection = 'projects/'
