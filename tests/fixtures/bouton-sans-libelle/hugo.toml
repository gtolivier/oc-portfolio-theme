# Configuration ajoutée à exampleSite/hugo.toml par le test d'un bouton du
# hero sans libellé : l'accueil français du site d'exemple
# (content/_index.md) est remplacé par celui de
# tests/fixtures/bouton-sans-libelle/content, dont le second bouton a une
# url valide mais pas de label. Le reste du contenu du site d'exemple est
# monté tel quel. Les chemins sont relatifs à exampleSite/, dossier source
# de la construction.
[[module.mounts]]
  source = 'content'
  target = 'content'
  files = ['! /_index.md']
[[module.mounts]]
  source = '../tests/fixtures/bouton-sans-libelle/content'
  target = 'content'
